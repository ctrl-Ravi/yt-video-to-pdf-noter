<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { width:220px; background:#0d0d0f; color:#eee; font-family:'Segoe UI',sans-serif; padding:16px; margin:0; }
  h3 { margin:0 0 12px; font-size:14px; color:#a855f7; }
  p  { font-size:11px; color:#666; margin:0 0 12px; line-height:1.6; }
  .shortcuts { font-size:11px; }
  .sc { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #1a1a2e; }
  .sc code { background:#1a1a2e; padding:1px 6px; border-radius:4px; font-size:10px; color:#a855f7; }
  .sc span  { color:#888; }
</style>
</head>
<body>
<h3>YT Noter v2 AI</h3>
<p>The sidebar is injected directly on the page. Use shortcuts or the NOTES handle on the right.</p>
<div class="shortcuts">
  <div class="sc"><span>Screenshot</span><code>Alt+S</code></div>
  <div class="sc"><span>Toggle sidebar</span><code>Alt+H</code></div>
  <div class="sc"><span>Focus editor</span><code>Alt+N</code></div>
  <div class="sc"><span>AutoSnap</span><code>Alt+A</code></div>
  <div class="sc"><span>Insert timestamp</span><code>Alt+T</code></div>
  <div class="sc"><span>Save note</span><code>Alt+Enter</code></div>
</div>
</body>
</html>

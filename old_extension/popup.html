<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Noter Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  width: 260px;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #020817;
  color: #FFFFFF;
  overflow: hidden;
  border-radius: 16px;
}

/* ── Shell ── */
.wrap {
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #020817 0%, #071226 45%, #0A1730 100%);
  border: 1px solid #13203A;
  border-radius: 16px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.025) inset,
    0 0 50px rgba(70,90,140,0.18),
    0 24px 56px rgba(2,8,23,0.90);
}

/* ── Header ── */
.hd {
  padding: 18px 18px 14px;
  background: linear-gradient(180deg, rgba(2,8,23,0.85) 0%, transparent 100%);
  border-bottom: 1px solid #13203A;
  position: relative;
}

/* Accent line */
.hd::before {
  content: '';
  position: absolute;
  top: 0; left: 22%; right: 22%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #5B6CFF, transparent);
  opacity: 0.50;
}

.logo-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
}

.badge {
  width: 26px; height: 26px;
  background: linear-gradient(135deg, #5B6CFF, #7A8CFF);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 16px rgba(91,108,255,0.42);
}

.title-col { display: flex; flex-direction: column; gap: 1px; }

.title {
  font-size: 11px; font-weight: 800;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: #FFFFFF; line-height: 1;
}

.subtitle {
  font-size: 9px; font-weight: 500;
  color: #3B475D; letter-spacing: 0.05em;
}

/* Status pill */
.status {
  display: inline-flex; align-items: center; gap: 6px;
  background: #030712;
  border: 1px solid #13203A;
  border-radius: 6px; padding: 4px 10px;
  font-size: 10px; font-weight: 500; color: #3B475D;
  width: 100%;
}
.status-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #34D399; flex-shrink: 0;
  box-shadow: 0 0 6px rgba(52,211,153,0.7);
  animation: breathe 2.5s ease-in-out infinite;
}

/* ── Body ── */
.body { padding: 14px 18px 12px; }

.sc-label {
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: #3B475D; margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.sc-label::after {
  content: ''; flex: 1; height: 1px; background: #13203A;
}

.sc-list { display: flex; flex-direction: column; gap: 1px; }

.sc-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 8px; border-radius: 7px;
  transition: background 0.15s ease;
}
.sc-row:hover { background: rgba(19,32,58,0.60); }

.sc-name { font-size: 11px; font-weight: 500; color: #8A97B0; }

.sc-key {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 700;
  color: #7A8CFF;
  background: rgba(91,108,255,0.10);
  border: 1px solid rgba(91,108,255,0.22);
  border-radius: 5px; padding: 2px 7px;
  letter-spacing: 0.04em;
}

/* ── Footer ── */
.ft {
  padding: 10px 18px 14px;
  border-top: 1px solid #13203A;
  background: linear-gradient(0deg, #030712 0%, transparent 100%);
}
.ft-tip {
  font-size: 10px; color: #3B475D;
  line-height: 1.65; text-align: center;
}
.ft-tip span { color: #7A8CFF; font-weight: 600; }

/* ── Animations ── */
@keyframes breathe {
  0%, 100% { opacity: 0.5; transform: scale(1);   }
  50%       { opacity: 1;   transform: scale(1.3); }
}

</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="hd">
    <div class="logo-row">
      <div class="badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="title-col">
        <div class="title">YT Noter Pro</div>
        <div class="subtitle">Education note-taking engine</div>
      </div>
    </div>
    <div class="status">
      <div class="status-dot"></div>
      Sidebar injected on page load
    </div>
  </div>

  <!-- Shortcuts -->
  <div class="body">
    <div class="sc-label">Keyboard Shortcuts</div>
    <div class="sc-list">
      <div class="sc-row"><span class="sc-name">Screenshot</span>      <span class="sc-key">Alt + S</span></div>
      <div class="sc-row"><span class="sc-name">Toggle sidebar</span>  <span class="sc-key">Alt + H</span></div>
      <div class="sc-row"><span class="sc-name">Focus editor</span>    <span class="sc-key">Alt + N</span></div>
      <div class="sc-row"><span class="sc-name">Auto-snap toggle</span><span class="sc-key">Alt + A</span></div>
      <div class="sc-row"><span class="sc-name">Save note</span>       <span class="sc-key">Alt + Enter</span></div>
    </div>
  </div>

  <!-- Footer -->
  <div class="ft">
    <div class="ft-tip">
      Open a <span>YouTube video</span> and click the handle on the right to begin
    </div>
  </div>

</div>
</body>
</html>
